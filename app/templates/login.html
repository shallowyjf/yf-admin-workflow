<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 权限流程工单平台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-story">
      <p class="eyebrow light">YF ADMIN WORKFLOW</p>
      <h1>让权限边界清晰，<br>让每一步流程可追溯。</h1>
      <p>统一组织、角色、数据范围和工单流转，在一个演示环境里完成闭环。</p>
      <div class="process-line"><span>建单</span><i></i><span>派单</span><i></i><span>认领</span><i></i><span>复核</span></div>
    </section>
    <section class="login-card">
      <span class="brand-mark large">YF</span>
      <p class="eyebrow">欢迎回来</p>
      <h2>统一登录中心</h2>
      <p class="muted">系统将自动识别平台身份与所属城市，并进入对应工作空间。</p>
      <form id="login-form">
        <label>用户名<input name="username" autocomplete="username" value="admin" required></label>
        <label>密码<input type="password" name="password" autocomplete="current-password" value="Demo@123456" required></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="button primary wide" type="submit">进入工作台</button>
      </form>
      <div class="demo-hint"><strong>租户账号密码 Demo@123456</strong><span>admin · 江城市管理员</span><span>water_manager · 供水 GIS 管理员</span><span>gas_manager · 燃气 GIS 管理员</span><span>lisi · 江城市工程人员</span><span>平台账号 root / Root@123456</span></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const errorBox = document.querySelector('#login-error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      const values = new FormData(form);
      const response = await fetch('/auth/unified-login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(Object.fromEntries(values))
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        errorBox.textContent = payload.detail || '登录失败，请检查账号和密码。';
        return;
      }
      const payload = await response.json();
      location.href = payload.next_path;
    });
  </script>
</body>
</html>
