<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择城市租户</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/iam.css"></head><body class="platform-body"><main class="tenant-selector"><div class="page-intro"><div><p class="eyebrow">PLATFORM ROOT</p><h1>选择城市租户</h1><p>你好，{{ platform_context.display_name }}。选择后将以该城市租户管理员身份进入租户应用导航。</p></div><form method="post" action="/platform/logout"><button class="button ghost">退出平台</button></form></div><section class="tenant-grid">{% for tenant in tenants %}<article class="tenant-card"><span class="tenant-city">{{ tenant.tenant_name[:3] }}</span><h2>{{ tenant.tenant_name }}</h2><code>{{ tenant.tenant_code }}</code><p>权限中心 · 工单中心 · 五类生命线业务驾驶舱</p><form method="post" action="/platform/tenants/{{ tenant.id }}/enter"><button class="button primary wide">进入该城市 →</button></form></article>{% endfor %}</section></main></body></html>
